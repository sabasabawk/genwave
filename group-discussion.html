<!DOCTYPE html>
<html lang="en">
<head>
<!-- =====================================================
     PART 1 OF 6 — DOCUMENT SETUP AND STYLES
===================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group - GenWave</title>
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #222222;
      --muted-text: #666666;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 30px;
    }
    .topbar {
      background: linear-gradient(135deg, #007bff, #00d2ff);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar a { color: white; text-decoration: none; font-size: 20px; }
    .topbar .icon-mini {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .topbar .name { font-size: 15px; font-weight: 700; }
    .topbar .meta { font-size: 11px; opacity: 0.9; }

    .group-info-card {
      background: var(--card-bg);
      margin: 16px;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .group-info-card p { font-size: 13px; color: var(--muted-text); margin: 0 0 12px; }
    .join-toggle-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      background: var(--primary-color);
      color: white;
    }
    .join-toggle-btn.joined { background: #e8f2ff; color: var(--primary-color); }

    .composer {
      background: var(--card-bg);
      margin: 0 16px 16px;
      padding: 14px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .composer textarea {
      width: 100%;
      border: 1px solid #e4e6eb;
      border-radius: 10px;
      padding: 10px;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      min-height: 60px;
    }
    .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .media-btn-small {
      background: #f0f2f5;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .post-btn-small {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
    }
    .post-btn-small:disabled { background: #a0c4e8; }
    .media-preview-small { margin-top: 8px; display: none; }
    .media-preview-small img, .media-preview-small video {
      max-height: 140px;
      border-radius: 8px;
      display: block;
    }
    .media-preview-small .cancel-media {
      display: inline-block;
      margin-top: 4px;
      color: #b00020;
      font-size: 11px;
      font-weight: 700;
    }
    .locked-notice {
      text-align: center;
      color: var(--muted-text);
      font-size: 13px;
      padding: 10px 0;
    }

    .posts-list { padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
    .post-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .post-author-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007bff, #00d2ff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      flex-shrink: 0;
    }
    .post-author-name { font-weight: 700; font-size: 13px; }
    .post-time { font-size: 11px; color: var(--muted-text); }
    .post-content { font-size: 14px; margin-bottom: 8px; line-height: 1.4; }
    .post-media { width: 100%; border-radius: 10px; max-height: 300px; object-fit: cover; display: block; margin-bottom: 8px; }
    .post-actions { display: flex; gap: 8px; padding-top: 8px; border-top: 1px solid #eee; }
    .post-actions button {
      background: #f0f2f5;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted-text);
    }
    .post-actions button.liked { background: #ffe5ea; color: #c2183b; }

    .empty-state { text-align: center; padding: 30px 20px; color: var(--muted-text); }
    .empty-state .icon { font-size: 36px; margin-bottom: 8px; }
  </style>
</head>
<body>

<!-- =====================================================
     PART 2 OF 6 — TOP BAR
===================================================== -->

  <div class="topbar">
    <a href="groups.html">&larr;</a>
    <div class="icon-mini" id="group-icon">🌊</div>
    <div>
      <div class="name" id="group-name">Loading...</div>
      <div class="meta" id="group-meta"></div>
    </div>
  </div>

<!-- =====================================================
     PART 3 OF 6 — GROUP INFO + JOIN BUTTON
===================================================== -->

  <div class="group-info-card">
    <p id="group-description"></p>
    <button class="join-toggle-btn" id="join-toggle-btn">Join Group</button>
  </div>

<!-- =====================================================
     PART 4 OF 6 — COMPOSER
===================================================== -->

  <div class="composer" id="composer">
    <textarea id="post-input" placeholder="Share something with the group..."></textarea>
    <div class="media-preview-small" id="media-preview-small"></div>
    <div class="composer-actions">
      <label class="media-btn-small">
        📷 Photo/Video
        <input type="file" id="file-input" accept="image/*,video/*" style="display:none;">
      </label>
      <button class="post-btn-small" id="post-btn">Post</button>
    </div>
  </div>

<!-- =====================================================
     PART 5 OF 6 — POSTS FEED
===================================================== -->

  <div class="posts-list" id="posts-list">
    <div class="empty-state">
      <div class="icon">🌊</div>
      <p>Loading discussion...</p>
    </div>
  </div>

<!-- =====================================================
     PART 6 OF 6 — FIREBASE + CLOUDINARY LOGIC
===================================================== -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, addDoc, getDocs, updateDoc, increment, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBntgbWufmOsE-zW3sqpF8MXlXpCfvTUb4",
      authDomain: "genwave-f7e38.firebaseapp.com",
      projectId: "genwave-f7e38",
      storageBucket: "genwave-f7e38.firebasestorage.app",
      messagingSenderId: "464171809471",
      appId: "1:464171809471:web:9051791ab5b5f99616a40a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', 'genwave_unsigned');
      const response = await fetch('https://api.cloudinary.com/v1_1/glq2nymz/auto/upload', {
        method: 'POST',
        body: formData
      });
      if (!response.ok) throw new Error('Cloudinary upload failed');
      const data = await response.json();
      return data.secure_url;
    }

    function groupIcon(category) {
      const icons = { Music: "🎵", Sports: "⚽", Tech: "💻", Faith: "🙏", Cooking: "🍲" };
      return icons[category] || "🌊";
    }

    function formatTime(timestamp) {
      if (!timestamp) return "";
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      const diffMins = Math.floor((Date.now() - date.getTime()) / 60000);
      if (diffMins < 1) return "now";
      if (diffMins < 60) return `${diffMins}m`;
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours}h`;
      return `${Math.floor(diffHours / 24)}d`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const groupId = urlParams.get('groupId');

    let currentUser = null;
    let isJoined = false;
    let selectedFile = null;
    let selectedFileType = null;
    let allGroupPosts = [];

    const joinToggleBtn = document.getElementById('join-toggle-btn');
    const composer = document.getElementById('composer');
    const postInput = document.getElementById('post-input');
    const postBtn = document.getElementById('post-btn');
    const fileInput = document.getElementById('file-input');
    const mediaPreviewSmall = document.getElementById('media-preview-small');
    const postsList = document.getElementById('posts-list');

    function updateComposerVisibility() {
      if (isJoined) {
        composer.style.display = 'block';
      } else {
        composer.innerHTML = `<div class="locked-notice">Join this group to post and comment.</div>`;
      }
    }

    async function loadGroupInfo() {
      const snap = await getDoc(doc(db, "groups", groupId));
      if (!snap.exists()) {
        document.getElementById('group-name').textContent = "Group not found";
        return;
      }
      const g = snap.data();
      document.getElementById('group-icon').textContent = groupIcon(g.category);
      document.getElementById('group-name').textContent = g.name;
      document.getElementById('group-meta').textContent = `${g.memberCount || 0} members · ${g.category}`;
      document.getElementById('group-description').textContent = g.description || "";
    }

    async function checkMembership() {
      if (!currentUser) return;
      const snap = await getDoc(doc(db, "users", currentUser.uid, "joinedGroups", groupId));
      isJoined = snap.exists();
      joinToggleBtn.textContent = isJoined ? "Joined ✓" : "Join Group";
      joinToggleBtn.classList.toggle('joined', isJoined);
      updateComposerVisibility();
    }

    joinToggleBtn.addEventListener('click', async () => {
      if (!currentUser) { window.location.href = "login.html"; return; }
      joinToggleBtn.disabled = true;
      try {
        const groupRef = doc(db, "groups", groupId);
        const userGroupRef = doc(db, "users", currentUser.uid, "joinedGroups", groupId);
        if (isJoined) {
          await deleteDoc(userGroupRef);
          await updateDoc(groupRef, { memberCount: increment(-1) });
        } else {
          await setDoc(userGroupRef, { joinedAt: new Date() });
          await updateDoc(groupRef, { memberCount: increment(1) });
        }
        await loadGroupInfo();
        await checkMembership();
      } catch (err) {
        console.error("Error toggling membership:", err);
        alert("Could not update membership.");
      } finally {
        joinToggleBtn.disabled = false;
      }
    });

    fileInput?.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      selectedFile = file;
      selectedFileType = file.type.startsWith('video/') ? 'video' : 'image';
      const url = URL.createObjectURL(file);
      mediaPreviewSmall.style.display = 'block';
      mediaPreviewSmall.innerHTML = `
        ${selectedFileType === 'video' ? `<video src="${url}" muted controls></video>` : `<img src="${url}">`}
        <span class="cancel-media" id="cancel-media-small">Remove</span>
      `;
      document.getElementById('cancel-media-small').addEventListener('click', () => {
        selectedFile = null;
        selectedFileType = null;
        mediaPreviewSmall.style.display = 'none';
        mediaPreviewSmall.innerHTML = '';
        fileInput.value = '';
      });
    });

    postBtn?.addEventListener('click', async () => {
      const text = postInput.value.trim();
      if (!text && !selectedFile) return;

      postBtn.disabled = true;
      postBtn.textContent = "Posting...";

      try {
        let authorName = "GenWave Member";
        const userSnap = await getDoc(doc(db, "users", currentUser.uid));
        if (userSnap.exists()) authorName = userSnap.data().fullName || authorName;

        let mediaUrl = null;
        let mediaType = null;
        if (selectedFile) {
          mediaType = selectedFileType;
          mediaUrl = await uploadToCloudinary(selectedFile);
        }

        await addDoc(collection(db, "groups", groupId, "posts"), {
          uid: currentUser.uid,
          authorName: authorName,
          content: text,
          mediaUrl: mediaUrl,
          mediaType: mediaType,
          likes: [],
          createdAt: new Date()
        });

        postInput.value = "";
        selectedFile = null;
        mediaPreviewSmall.style.display = 'none';
        mediaPreviewSmall.innerHTML = '';
        if (fileInput) fileInput.value = '';

        await loadGroupPosts();
      } catch (err) {
        console.error("Error posting to group:", err);
        alert("Could not post. Please try again.");
      } finally {
        postBtn.disabled = false;
        postBtn.textContent = "Post";
      }
    });

    function renderGroupPosts() {
      if (allGroupPosts.length === 0) {
        postsList.innerHTML = `<div class="empty-state"><div class="icon">💬</div><p>No posts yet. Be the first to share something!</p></div>`;
        return;
      }

      postsList.innerHTML = allGroupPosts.map(post => {
        const initial = (post.authorName || "G").charAt(0).toUpperCase();
        const likes = Array.isArray(post.likes) ? post.likes : [];
        const liked = currentUser && likes.includes(currentUser.uid);
        let mediaHtml = "";
        if (post.mediaUrl) {
          mediaHtml = post.mediaType === 'video'
            ? `<video src="${post.mediaUrl}" controls class="post-media"></video>`
            : `<img src="${post.mediaUrl}" class="post-media">`;
        }
        return `
          <div class="post-card">
            <div class="post-header">
              <div class="post-author-avatar">${initial}</div>
              <div>
                <div class="post-author-name">${post.authorName}</div>
                <div class="post-time">${formatTime(post.createdAt)}</div>
              </div>
            </div>
            ${post.content ? `<div class="post-content">${post.content}</div>` : ""}
            ${mediaHtml}
            <div class="post-actions">
              <button class="like-btn ${liked ? 'liked' : ''}" data-id="${post.id}">❤️ ${likes.length}</button>
            </div>
          </div>
        `;
      }).join('');
    }

    postsList.addEventListener('click', async (e) => {
      const likeBtn = e.target.closest('.like-btn');
      if (!likeBtn) return;
      if (!currentUser) { window.location.href = "login.html"; return; }

      const postId = likeBtn.dataset.id;
      const post = allGroupPosts.find(p => p.id === postId);
      if (!post) return;

      const likes = Array.isArray(post.likes) ? post.likes : [];
      const already = likes.includes(currentUser.uid);
      const updated = already ? likes.filter(u => u !== currentUser.uid) : [...likes, currentUser.uid];

      try {
        await updateDoc(doc(db, "groups", groupId, "posts", postId), { likes: updated });
        post.likes = updated;
        renderGroupPosts();
      } catch (err) {
        console.error("Error liking group post:", err);
      }
    });

    async function loadGroupPosts() {
      try {
        const q = query(collection(db, "groups", groupId, "posts"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        allGroupPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderGroupPosts();
      } catch (err) {
        console.error("Error loading group posts:", err);
        postsList.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Could not load discussion.</p></div>`;
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      if (!groupId) {
        window.location.href = "groups.html";
        return;
      }
      currentUser = user;

      await loadGroupInfo();
      await checkMembership();
      await loadGroupPosts();
    });
  </script>

</body>
</html>
