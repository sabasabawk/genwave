<!DOCTYPE html>
<html lang="en">
<head>
<!-- =====================================================
     PART 1 OF 4 — DOCUMENT SETUP AND STYLES
===================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos - GenWave</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    .close-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      font-size: 22px;
    }

    .reel-track {
      height: 100vh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .reel-slide {
      position: relative;
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .reel-slide video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .reel-info {
      position: absolute;
      bottom: 30px;
      left: 16px;
      right: 70px;
      color: white;
    }
    .reel-info .author { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .reel-info .caption { font-size: 13px; opacity: 0.9; }

    .loading-msg { color: white; text-align: center; padding: 40px; }
  </style>
</head>
<body>

<!-- =====================================================
     PART 2 OF 4 — CLOSE BUTTON + TRACK
===================================================== -->

  <button class="close-btn" id="close-btn">&times;</button>
  <div class="reel-track" id="reel-track">
    <div class="loading-msg">Loading videos...</div>
  </div>

<!-- =====================================================
     PART 3 OF 4 — (reserved)
===================================================== -->

<!-- =====================================================
     PART 4 OF 4 — FIREBASE LOGIC
===================================================== -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBntgbWufmOsE-zW3sqpF8MXlXpCfvTUb4",
      authDomain: "genwave-f7e38.firebaseapp.com",
      projectId: "genwave-f7e38",
      storageBucket: "genwave-f7e38.firebasestorage.app",
      messagingSenderId: "464171809471",
      appId: "1:464171809471:web:9051791ab5b5f99616a40a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const startPostId = urlParams.get('start');

    const reelTrack = document.getElementById('reel-track');
    const closeBtn = document.getElementById('close-btn');

    closeBtn.addEventListener('click', () => window.location.href = "home.html");

    let observer = null;

    function startAutoplayObserver() {
      const videos = reelTrack.querySelectorAll('video');
      if (observer) observer.disconnect();

      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const video = entry.target;
          if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
            videos.forEach(v => { if (v !== video) v.pause(); });
            video.muted = false;
            const p = video.play();
            if (p !== undefined) p.catch(() => {});
          } else {
            video.pause();
          }
        });
      }, { threshold: [0, 0.6, 1] });

      videos.forEach(v => observer.observe(v));
    }

    async function loadVideos() {
      try {
        const snap = await getDocs(collection(db, "posts"));
        const videoPosts = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(p => p.mediaType === 'video' && p.mediaUrl)
          .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));

        if (videoPosts.length === 0) {
          reelTrack.innerHTML = `<div class="loading-msg">No videos yet.</div>`;
          return;
        }

        if (startPostId) {
          const startIndex = videoPosts.findIndex(p => p.id === startPostId);
          if (startIndex > 0) {
            const [item] = videoPosts.splice(startIndex, 1);
            videoPosts.unshift(item);
          }
        }

        reelTrack.innerHTML = videoPosts.map(post => `
          <div class="reel-slide">
            <video src="${post.mediaUrl}" loop playsinline muted></video>
            <div class="reel-info">
              <div class="author">${post.authorName || "GenWave Member"}</div>
              ${post.content ? `<div class="caption">${post.content}</div>` : ""}
            </div>
          </div>
        `).join('');

        startAutoplayObserver();
      } catch (err) {
        console.error("Error loading videos:", err);
        reelTrack.innerHTML = `<div class="loading-msg">Could not load videos.</div>`;
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      loadVideos();
    });
  </script>

</body>
</html>
