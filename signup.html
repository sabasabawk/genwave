<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - GenWave</title>
  <style>
    :root {
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #222222;
      --muted-text: #666666;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #007bff, #00d2ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      max-width: 420px;
      width: 100%;
    }
    .card a.back {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--muted-text);
      text-decoration: none;
      font-size: 14px;
    }
    h2 {
      margin: 0 0 6px;
      font-size: 24px;
      color: var(--text-color);
    }
    .subtitle {
      color: var(--muted-text);
      font-size: 14px;
      margin-bottom: 24px;
    }
    input, textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    textarea { resize: vertical; min-height: 70px; }
    button {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover { background-color: var(--primary-hover); }
    button:disabled {
      background-color: #a0c4e8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <a href="index.html" class="back">&larr; Back</a>
    <h2>Create Your Account</h2>
    <p class="subtitle">Join GenWave and find your community.</p>
    <form id="signup-form">
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="password" id="password" placeholder="Password" required />
      <input type="text" id="fullname" placeholder="Full Name" required />
      <textarea id="bio" placeholder="Short Bio (1-2 lines)"></textarea>
      <input type="text" id="interests" placeholder="Interests (e.g. coding, music, sports)" />
      <input type="text" id="location" placeholder="City / Country (Optional)" />
      <button type="submit" id="submit-btn">Get Started</button>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBntgbWufmOsE-zW3sqpF8MXlXpCfvTUb4",
      authDomain: "genwave-f7e38.firebaseapp.com",
      projectId: "genwave-f7e38",
      storageBucket: "genwave-f7e38.firebasestorage.app",
      messagingSenderId: "464171809471",
      appId: "1:464171809471:web:9051791ab5b5f99616a40a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const signupForm = document.getElementById('signup-form');
    const submitBtn = document.getElementById('submit-btn');

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullname').value;
      const bio = document.getElementById('bio').value;
      const interests = document.getElementById('interests').value.split(',').map(item => item.trim());
      const location = document.getElementById('location').value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          email: email,
          fullName: fullName,
          bio: bio,
          interests: interests,
          location: location,
          createdAt: new Date()
        });
        window.location.href = "home.html";
      } catch (error) {
        alert("Error: " + error.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Get Started";
      }
    });
  </script>

</body>
</html>
