<!DOCTYPE html>
<html lang="en">
<head>
<!-- =====================================================
     PART 1 OF 4 — DOCUMENT SETUP AND STYLES
===================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Member Profile - GenWave</title>
  <style>
    :root {
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #222222;
      --muted-text: #666666;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 40px;
    }
    .topbar {
      background: linear-gradient(135deg, #007bff, #00d2ff);
      height: 110px;
      position: relative;
    }
    .topbar a.back {
      position: absolute;
      top: 14px;
      left: 16px;
      color: white;
      text-decoration: none;
      font-size: 22px;
    }
    .profile-header {
      padding: 0 20px;
      margin-top: -45px;
      text-align: center;
    }
    .avatar-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: white;
      border: 4px solid white;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      color: var(--primary-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .profile-location { font-size: 13px; color: var(--muted-text); margin-bottom: 10px; }
    .profile-bio {
      font-size: 14px;
      color: var(--text-color);
      max-width: 340px;
      margin: 0 auto 16px;
      line-height: 1.5;
    }
    .interests {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 0 20px 20px;
    }
    .interest-tag {
      background: #e8f2ff;
      color: var(--primary-color);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 16px;
    }
    .message-btn {
      display: block;
      width: calc(100% - 40px);
      margin: 10px 20px;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .loading-state { text-align: center; padding: 60px 20px; color: var(--muted-text); }
  </style>
</head>
<body>

<!-- =====================================================
     PART 2 OF 4 — TOP BAR
===================================================== -->

  <div class="topbar">
    <a href="javascript:history.back()" class="back">&larr;</a>
  </div>

<!-- =====================================================
     PART 3 OF 4 — PROFILE CONTENT
===================================================== -->

  <div id="profile-content">
    <div class="loading-state">Loading profile...</div>
  </div>

<!-- =====================================================
     PART 4 OF 4 — FIREBASE LOGIC
===================================================== -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBntgbWufmOsE-zW3sqpF8MXlXpCfvTUb4",
      authDomain: "genwave-f7e38.firebaseapp.com",
      projectId: "genwave-f7e38",
      storageBucket: "genwave-f7e38.firebasestorage.app",
      messagingSenderId: "464171809471",
      appId: "1:464171809471:web:9051791ab5b5f99616a40a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const targetUid = urlParams.get('uid');

    const profileContent = document.getElementById('profile-content');

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      if (!targetUid) {
        profileContent.innerHTML = `<div class="loading-state">Member not found.</div>`;
        return;
      }

      if (targetUid === user.uid) {
        window.location.href = "profile.html";
        return;
      }

      try {
        const snap = await getDoc(doc(db, "users", targetUid));
        if (!snap.exists()) {
          profileContent.innerHTML = `<div class="loading-state">Member not found.</div>`;
          return;
        }

        const data = snap.data();
        const name = data.fullName || "GenWave User";
        const interests = Array.isArray(data.interests) ? data.interests : [];

        profileContent.innerHTML = `
          <div class="profile-header">
            <div class="avatar-circle">${name.charAt(0).toUpperCase()}</div>
            <div class="profile-name">${name}</div>
            <div class="profile-location">${data.location || ""}</div>
            <div class="profile-bio">${data.bio || ""}</div>
          </div>
          <div class="interests">
            ${interests.filter(Boolean).map(i => `<span class="interest-tag">${i}</span>`).join('')}
          </div>
          <a href="chat.html?uid=${encodeURIComponent(targetUid)}" class="message-btn">💬 Message</a>
        `;
      } catch (err) {
        console.error("Error loading member profile:", err);
        profileContent.innerHTML = `<div class="loading-state">Could not load this profile.</div>`;
      }
    });
  </script>

</body>
</html>
