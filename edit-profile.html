<!DOCTYPE html>
<html lang="en">
<head>
<!-- =====================================================
     PART 1 OF 4 — DOCUMENT SETUP AND STYLES
===================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - GenWave</title>
  <style>
    :root {
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #222222;
      --muted-text: #666666;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 40px;
    }
    .topbar {
      background: linear-gradient(135deg, #007bff, #00d2ff);
      color: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .topbar a {
      color: white;
      text-decoration: none;
      font-size: 20px;
    }
    .topbar .title { font-size: 18px; font-weight: 800; }

    .form-card {
      background: var(--card-bg);
      margin: 20px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted-text);
      margin-bottom: 6px;
      margin-top: 16px;
    }
    label:first-child { margin-top: 0; }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }
    textarea { resize: vertical; min-height: 70px; }
    .hint { font-size: 11px; color: var(--muted-text); margin-top: 4px; }

    .save-btn {
      display: block;
      width: calc(100% - 40px);
      margin: 10px 20px;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .save-btn:disabled { background: #a0c4e8; cursor: not-allowed; }
  </style>
</head>
<body>

<!-- =====================================================
     PART 2 OF 4 — TOP BAR
===================================================== -->

  <div class="topbar">
    <a href="profile.html">&larr;</a>
    <div class="title">Edit Profile</div>
  </div>

<!-- =====================================================
     PART 3 OF 4 — EDIT FORM
===================================================== -->

  <div class="form-card">
    <form id="edit-form">
      <label>Full Name</label>
      <input type="text" id="fullname" required>

      <label>Short Bio</label>
      <textarea id="bio" placeholder="1-2 lines about yourself"></textarea>

      <label>Interests</label>
      <input type="text" id="interests" placeholder="e.g. music, football, cooking">
      <div class="hint">Separate with commas</div>

      <label>Location</label>
      <input type="text" id="location" placeholder="City / Country (optional)">
    </form>
  </div>

  <button class="save-btn" id="save-btn" form="edit-form" type="submit">Save Changes</button>

<!-- =====================================================
     PART 4 OF 4 — FIREBASE LOGIC
===================================================== -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBntgbWufmOsE-zW3sqpF8MXlXpCfvTUb4",
      authDomain: "genwave-f7e38.firebaseapp.com",
      projectId: "genwave-f7e38",
      storageBucket: "genwave-f7e38.firebasestorage.app",
      messagingSenderId: "464171809471",
      appId: "1:464171809471:web:9051791ab5b5f99616a40a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;

      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          const data = snap.data();
          document.getElementById('fullname').value = data.fullName || "";
          document.getElementById('bio').value = data.bio || "";
          document.getElementById('interests').value = Array.isArray(data.interests) ? data.interests.join(", ") : "";
          document.getElementById('location').value = data.location || "";
        }
      } catch (err) {
        console.error("Error loading profile for editing:", err);
      }
    });

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      const fullName = document.getElementById('fullname').value.trim();
      const bio = document.getElementById('bio').value.trim();
      const interests = document.getElementById('interests').value.split(',').map(i => i.trim()).filter(Boolean);
      const location = document.getElementById('location').value.trim();

      try {
        await updateDoc(doc(db, "users", currentUser.uid), {
          fullName, bio, interests, location
        });
        window.location.href = "profile.html";
      } catch (err) {
        console.error("Error saving profile:", err);
        alert("Could not save changes. Please try again.");
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Changes";
      }
    });
  </script>

</body>
</html>
