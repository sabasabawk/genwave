<!DOCTYPE html>
<html lang="en">
<head>
<!-- =====================================================
     PART 1 OF 5 — DOCUMENT SETUP AND STYLES
===================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - GenWave</title>
  <style>
    :root {
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #222222;
      --muted-text: #666666;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 70px;
    }
    .cover {
      background: linear-gradient(135deg, #007bff, #00d2ff);
      height: 110px;
      position: relative;
    }
    .profile-header {
      padding: 0 20px;
      margin-top: -45px;
      text-align: center;
    }
    .avatar-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: white;
      border: 4px solid white;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      color: var(--primary-color);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .profile-name { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .profile-location { font-size: 13px; color: var(--muted-text); margin-bottom: 10px; }
    .profile-bio {
      font-size: 14px;
      color: var(--text-color);
      max-width: 340px;
      margin: 0 auto 16px;
      line-height: 1.5;
    }

    .interests {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 0 20px 20px;
    }
    .interest-tag {
      background: #e8f2ff;
      color: var(--primary-color);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 16px;
    }

    .section {
      background: var(--card-bg);
      margin: 0 20px 16px;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .section h3 { margin: 0 0 12px; font-size: 15px; }
    .section-empty { color: var(--muted-text); font-size: 13px; text-align: center; padding: 10px 0; }

    .group-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
    }
    .group-mini .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #007bff, #00d2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 16px;
      flex-shrink: 0;
    }
    .group-mini .name { font-size: 13px; font-weight: 600; }

    .action-btn {
      display: block;
      width: calc(100% - 40px);
      margin: 0 20px 12px;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .edit-btn { background: var(--primary-color); color: white; }
    .logout-btn { background: #ffe1e1; color: #b00020; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.06);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: var(--muted-text);
      text-decoration: none;
    }
    .nav-item.active { color: var(--primary-color); font-weight: 700; }
    .nav-item .nav-icon { font-size: 20px; }
  </style>
</head>
<body>

<!-- =====================================================
     PART 2 OF 5 — PROFILE HEADER
===================================================== -->

  <div class="cover"></div>
  <div class="profile-header">
    <div class="avatar-circle" id="avatar-initial">?</div>
    <div class="profile-name" id="profile-name">Loading...</div>
    <div class="profile-location" id="profile-location"></div>
    <div class="profile-bio" id="profile-bio"></div>
  </div>

  <div class="interests" id="profile-interests"></div>

<!-- =====================================================
     PART 3 OF 5 — MY GROUPS SECTION
===================================================== -->

  <div class="section">
    <h3>My Groups</h3>
    <div id="my-groups-list">
      <div class="section-empty">Loading your groups...</div>
    </div>
  </div>

<!-- =====================================================
     PART 4 OF 5 — ACTIONS AND BOTTOM NAV
===================================================== -->

  <a href="edit-profile.html" class="action-btn edit-btn">Edit Profile</a>
  <button class="action-btn logout-btn" id="logout-btn">Log Out</button>
<div class="bottom-nav">
    <a href="home.html" class="nav-item">
      <div class="nav-icon">🏠</div>
      Home
    </a>
    <a href="groups.html" class="nav-item">
      <div class="nav-icon">👥</div>
      Groups
    </a>
    <a href="conversations.html" class="nav-item">
      <div class="nav-icon">💬</div>
      Messages
    </a>
    <a href="profile.html" class="nav-item active">
      <div class="nav-icon">👤</div>
      Profile
    </a>
  </div>

<!-- =====================================================
     PART 5 OF 5 — FIREBASE LOGIC
===================================================== -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBntgbWufmOsE-zW3sqpF8MXlXpCfvTUb4",
      authDomain: "genwave-f7e38.firebaseapp.com",
      projectId: "genwave-f7e38",
      storageBucket: "genwave-f7e38.firebasestorage.app",
      messagingSenderId: "464171809471",
      appId: "1:464171809471:web:9051791ab5b5f99616a40a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    function groupIcon(category) {
      const icons = { Music: "🎵", Sports: "⚽", Tech: "💻", Faith: "🙏", Cooking: "🍲" };
      return icons[category] || "🌊";
    }

    document.getElementById('logout-btn').addEventListener('click', () => {
      if (confirm("Log out of GenWave?")) {
        signOut(auth).then(() => window.location.href = "login.html");
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }

      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          const data = snap.data();
          document.getElementById('profile-name').textContent = data.fullName || "GenWave User";
          document.getElementById('avatar-initial').textContent = (data.fullName || "?").charAt(0).toUpperCase();
          document.getElementById('profile-location').textContent = data.location || "";
          document.getElementById('profile-bio').textContent = data.bio || "";

          const interestsBox = document.getElementById('profile-interests');
          const interests = Array.isArray(data.interests) ? data.interests : [];
          interestsBox.innerHTML = interests.filter(Boolean).map(i => `<span class="interest-tag">${i}</span>`).join('');
        }

        const joinedSnap = await getDocs(collection(db, "users", user.uid, "joinedGroups"));
        const myGroupsList = document.getElementById('my-groups-list');

        if (joinedSnap.empty) {
          myGroupsList.innerHTML = `<div class="section-empty">You haven't joined any groups yet.</div>`;
        } else {
          const groupPromises = joinedSnap.docs.map(async (jd) => {
            const groupDoc = await getDoc(doc(db, "groups", jd.id));
            return groupDoc.exists() ? { id: groupDoc.id, ...groupDoc.data() } : null;
          });
          const groups = (await Promise.all(groupPromises)).filter(Boolean);

          if (groups.length === 0) {
            myGroupsList.innerHTML = `<div class="section-empty">You haven't joined any groups yet.</div>`;
          } else {
            myGroupsList.innerHTML = groups.map(g => `
              <div class="group-mini">
                <div class="icon">${groupIcon(g.category)}</div>
                <div class="name">${g.name}</div>
              </div>
            `).join('');
          }
        }
      } catch (err) {
        console.error("Error loading profile:", err);
      }
    });
  </script>

</body>
</html>
