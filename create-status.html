<!DOCTYPE html>
<html lang="en">
<head>
<!-- =====================================================
     PART 1 OF 4 — DOCUMENT SETUP AND STYLES
===================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Status - GenWave</title>
  <style>
    :root {
      --primary-color: #007bff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: #000;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
    }
    .topbar a { color: white; text-decoration: none; font-size: 22px; }
    .topbar .title { font-size: 16px; font-weight: 700; }

    .preview-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .preview-area img, .preview-area video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .picker-prompt {
      text-align: center;
      color: #aaa;
      padding: 20px;
    }
    .picker-prompt .icon { font-size: 50px; margin-bottom: 14px; }
    .pick-btn {
      display: inline-block;
      margin-top: 14px;
      background: var(--primary-color);
      color: white;
      padding: 12px 28px;
      border-radius: 24px;
      font-weight: 700;
      font-size: 14px;
      border: none;
    }

    .bottom-bar {
      padding: 16px;
    }
    .post-btn {
      width: 100%;
      padding: 14px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
    }
    .post-btn:disabled { background: #555; }
  </style>
</head>
<body>

<!-- =====================================================
     PART 2 OF 4 — TOP BAR
===================================================== -->

  <div class="topbar">
    <a href="home.html">&times;</a>
    <div class="title">Add Status</div>
    <div style="width:22px;"></div>
  </div>

<!-- =====================================================
     PART 3 OF 4 — PREVIEW + PICKER
===================================================== -->

  <div class="preview-area" id="preview-area">
    <div class="picker-prompt">
      <div class="icon">📷</div>
      <p>Share a photo or video<br>that disappears in 24 hours</p>
      <button class="pick-btn" id="pick-btn">Choose from Gallery</button>
      <input type="file" id="file-input" accept="image/*,video/*" style="display:none;">
    </div>
  </div>

  <div class="bottom-bar">
    <button class="post-btn" id="post-btn" disabled>Post Status</button>
  </div>

<!-- =====================================================
     PART 4 OF 4 — FIREBASE + CLOUDINARY LOGIC
===================================================== -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBntgbWufmOsE-zW3sqpF8MXlXpCfvTUb4",
      authDomain: "genwave-f7e38.firebaseapp.com",
      projectId: "genwave-f7e38",
      storageBucket: "genwave-f7e38.firebasestorage.app",
      messagingSenderId: "464171809471",
      appId: "1:464171809471:web:9051791ab5b5f99616a40a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', 'genwave_unsigned');

      const response = await fetch('https://api.cloudinary.com/v1_1/glq2nymz/auto/upload', {
        method: 'POST',
        body: formData
      });

      if (!response.ok) throw new Error('Cloudinary upload failed');
      const data = await response.json();
      return data.secure_url;
    }

    let currentUser = null;
    let selectedFile = null;

    const pickBtn = document.getElementById('pick-btn');
    const fileInput = document.getElementById('file-input');
    const previewArea = document.getElementById('preview-area');
    const postBtn = document.getElementById('post-btn');

    pickBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      selectedFile = file;

      const url = URL.createObjectURL(file);
      const isVideo = file.type.startsWith('video/');
      previewArea.innerHTML = isVideo
        ? `<video src="${url}" controls autoplay muted></video>`
        : `<img src="${url}">`;

      postBtn.disabled = false;
    });

    postBtn.addEventListener('click', async () => {
      if (!selectedFile || !currentUser) return;

      postBtn.disabled = true;
      postBtn.textContent = "Posting...";

      try {
        const mediaType = selectedFile.type.startsWith('video/') ? 'video' : 'image';
        const mediaUrl = await uploadToCloudinary(selectedFile);

        await addDoc(collection(db, "statuses"), {
          userId: currentUser.uid,
          mediaUrl: mediaUrl,
          mediaType: mediaType,
          timestamp: serverTimestamp()
        });

        window.location.href = "home.html";
      } catch (err) {
        console.error("Error posting status:", err);
        alert("Could not post status. Please try again.");
        postBtn.disabled = false;
        postBtn.textContent = "Post Status";
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
    });
  </script>

</body>
</html>
