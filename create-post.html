<!DOCTYPE html>
<html lang="en">
<head>
<!-- =====================================================
     PART 1 OF 4 — DOCUMENT SETUP AND STYLES
===================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Post - GenWave</title>
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #f4f7f6;
      --text-color: #222222;
      --muted-text: #666666;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
    }
    .topbar {
      background: linear-gradient(135deg, #007bff, #00d2ff);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
    }
    .topbar a { color: white; text-decoration: none; font-size: 22px; }
    .topbar .title { font-size: 16px; font-weight: 700; }
    .post-btn-top {
      background: white;
      color: var(--primary-color);
      border: none;
      padding: 8px 16px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 13px;
    }
    .post-btn-top:disabled { opacity: 0.6; }

    .form-card { padding: 16px; }
    textarea {
      width: 100%;
      border: 1px solid #e4e6eb;
      border-radius: 12px;
      padding: 14px;
      font-family: inherit;
      font-size: 15px;
      resize: none;
      outline: none;
      min-height: 120px;
      background: white;
    }

    .category-label { font-size: 13px; font-weight: 700; color: var(--muted-text); margin: 16px 0 8px; }
    .categories-scroll { display: flex; gap: 8px; overflow-x: auto; }
    .chip {
      background: #e4e6eb;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chip.active { background: var(--primary-color); color: white; }

    .media-preview-box { margin-top: 14px; display: none; }
    .media-preview-box img, .media-preview-box video {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      display: block;
    }
    .media-preview-box .cancel-media {
      display: inline-block;
      margin-top: 6px;
      color: #b00020;
      font-size: 12px;
      font-weight: 700;
    }

    .media-inputs { display: flex; gap: 10px; margin-top: 16px; }
    .media-btn {
      background: white;
      border: 1px solid #ddd;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<!-- =====================================================
     PART 2 OF 4 — TOP BAR
===================================================== -->

  <div class="topbar">
    <a href="home.html">&times;</a>
    <div class="title">Create Post</div>
    <button class="post-btn-top" id="post-btn">Post</button>
  </div>

<!-- =====================================================
     PART 3 OF 4 — FORM
===================================================== -->

  <div class="form-card">
    <textarea id="post-input" placeholder="Share a picture, video, or status update..."></textarea>

    <div class="category-label">Category</div>
    <div class="categories-scroll" id="categories">
      <button class="chip active" data-category="General">General</button>
      <button class="chip" data-category="Music">Music</button>
      <button class="chip" data-category="Sports">Sports</button>
      <button class="chip" data-category="Tech">Tech</button>
      <button class="chip" data-category="Faith">Faith</button>
      <button class="chip" data-category="Cooking">Cooking</button>
    </div>

    <div class="media-preview-box" id="media-preview-box"></div>

    <div class="media-inputs">
      <label class="media-btn">
        📷 Photo
        <input type="file" id="image-upload" accept="image/*" style="display:none;">
      </label>
      <label class="media-btn">
        🎥 Video
        <input type="file" id="video-upload" accept="video/*" style="display:none;">
      </label>
    </div>
  </div>

<!-- =====================================================
     PART 4 OF 4 — FIREBASE + CLOUDINARY LOGIC
===================================================== -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBntgbWufmOsE-zW3sqpF8MXlXpCfvTUb4",
      authDomain: "genwave-f7e38.firebaseapp.com",
      projectId: "genwave-f7e38",
      storageBucket: "genwave-f7e38.firebasestorage.app",
      messagingSenderId: "464171809471",
      appId: "1:464171809471:web:9051791ab5b5f99616a40a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    async function uploadToCloudinary(file) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', 'genwave_unsigned');

      const response = await fetch('https://api.cloudinary.com/v1_1/glq2nymz/auto/upload', {
        method: 'POST',
        body: formData
      });

      if (!response.ok) throw new Error('Cloudinary upload failed');
      const data = await response.json();
      return data.secure_url;
    }

    let currentUser = null;
    let selectedCategory = "General";
    let selectedFile = null;
    let selectedFileType = null;

    const postInput = document.getElementById('post-input');
    const postBtn = document.getElementById('post-btn');
    const categories = document.getElementById('categories');
    const imageUpload = document.getElementById('image-upload');
    const videoUpload = document.getElementById('video-upload');
    const mediaPreviewBox = document.getElementById('media-preview-box');

    categories.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      selectedCategory = chip.dataset.category;
      categories.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });

    function handleFileSelect(file, type) {
      selectedFile = file;
      selectedFileType = type;
      const url = URL.createObjectURL(file);
      mediaPreviewBox.style.display = 'block';
      mediaPreviewBox.innerHTML = `
        ${type === 'video' ? `<video src="${url}" muted controls></video>` : `<img src="${url}">`}
        <span class="cancel-media" id="cancel-media">Remove</span>
      `;
      document.getElementById('cancel-media').addEventListener('click', () => {
        selectedFile = null;
        selectedFileType = null;
        mediaPreviewBox.style.display = 'none';
        mediaPreviewBox.innerHTML = '';
        imageUpload.value = '';
        videoUpload.value = '';
      });
    }

    imageUpload.addEventListener('change', () => {
      if (imageUpload.files[0]) handleFileSelect(imageUpload.files[0], 'image');
    });
    videoUpload.addEventListener('change', () => {
      if (videoUpload.files[0]) handleFileSelect(videoUpload.files[0], 'video');
    });

    postBtn.addEventListener('click', async () => {
      const text = postInput.value.trim();
      if (!text && !selectedFile) return;

      postBtn.disabled = true;
      postBtn.textContent = "Posting...";

      try {
        let authorName = currentUser.displayName || "GenWave Member";
        const userDoc = await getDoc(doc(db, "users", currentUser.uid));
        if (userDoc.exists()) {
          authorName = userDoc.data().fullName || authorName;
        }

        let mediaUrl = null;
        let mediaType = null;

        if (selectedFile) {
          mediaType = selectedFileType;
          mediaUrl = await uploadToCloudinary(selectedFile);
        }

        await addDoc(collection(db, "posts"), {
          uid: currentUser.uid,
          authorName: authorName,
          content: text,
          category: selectedCategory,
          mediaUrl: mediaUrl,
          mediaType: mediaType,
          likes: [],
          commentsCount: 0,
          createdAt: serverTimestamp()
        });

        window.location.href = "home.html";
      } catch (err) {
        console.error("Error publishing post:", err);
        alert("Could not publish post. Please try again.");
        postBtn.disabled = false;
        postBtn.textContent = "Post";
      }
    });

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;
    });
  </script>

</body>
</html>
