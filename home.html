<!DOCTYPE html>
<html lang="en">
<head>
<!-- =====================================================
     PART 1 OF 7 — DOCUMENT SETUP AND STYLES
===================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - GenWave</title>
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #222222;
      --muted-text: #666666;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 80px;
    }
    .topbar {
      background: linear-gradient(135deg, #007bff, #00d2ff);
      color: white;
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 800;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .admin-link {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .user-avatar-small {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      text-decoration: none;
      flex-shrink: 0;
    }
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .welcome-text { font-size: 20px; font-weight: 800; margin: 0 0 4px 0; }
    .sub-text { color: var(--muted-text); font-size: 13px; margin: 0 0 16px 0; }

    .status-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }
    .status-strip::-webkit-scrollbar { display: none; }
    .status-circle-btn {
      flex-shrink: 0;
      width: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      color: var(--text-color);
      background: none;
      border: none;
      font-family: inherit;
    }
    .status-avatar-outer {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #007bff, #00d2ff);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid white;
      background: #e4e6eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: var(--primary-color);
    }
    .status-circle-btn.add-status .status-avatar-outer {
      background: #e4e6eb;
    }
    .status-circle-btn.add-status .status-avatar-inner {
      color: var(--primary-color);
      font-size: 24px;
    }
    .status-name {
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 64px;
    }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .categories-scroll::-webkit-scrollbar { display: none; }
    .chip {
      background: #e4e6eb;
      color: var(--text-color);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
    }
    .chip.active { background: var(--primary-color); color: white; }

    .post-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .post-author-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007bff, #00d2ff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }
    .post-author-name { font-weight: 700; font-size: 14px; }
    .post-time { font-size: 11px; color: var(--muted-text); }
    .post-content { font-size: 14px; margin-bottom: 10px; line-height: 1.4; }
    .post-media {
      width: 100%;
      border-radius: 12px;
      max-height: 350px;
      object-fit: cover;
      margin-bottom: 10px;
      display: block;
    }

    .post-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    .post-actions button {
      background: #f0f2f5;
      border: none;
      padding: 9px 6px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted-text);
    }
    .post-actions button.liked { background: #ffe5ea; color: #c2183b; }
    .post-actions button.report-btn { background: #fff0e0; color: #a35a00; }

    .admin-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .admin-delete-btn {
      background: #3a1010;
      color: #ffffff;
      border: none;
      padding: 9px 6px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted-text); }
    .empty-state .icon { font-size: 44px; margin-bottom: 10px; }

    #load-more-sentinel {
      text-align: center;
      padding: 16px;
      color: var(--muted-text);
      font-size: 13px;
    }

    .fab {
      position: fixed;
      right: 20px;
      bottom: 84px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      text-decoration: none;
      z-index: 20;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.06);
    }
    .nav-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: var(--muted-text);
      text-decoration: none;
    }
    .nav-item.active { color: var(--primary-color); font-weight: 700; }
    .nav-item .nav-icon { font-size: 20px; position: relative; }
    .unread-badge {
      position: absolute;
      top: -4px;
      right: -8px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 10px;
      background: #e60023;
      color: white;
      font-size: 10px;
      font-weight: 700;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .unread-badge.show { display: flex; }

    /* =====================================================
       REPORT MODAL
    ===================================================== */
    #report-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.55);
    }
    #report-modal.open { display: flex; }
    .report-modal-card {
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 22px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 32px rgba(0,0,0,.25);
    }
    .report-modal-card h3 {
      font-size: 18px;
      margin: 0 0 6px 0;
    }
    .report-modal-card p {
      color: var(--muted-text);
      font-size: 13px;
      margin: 0 0 16px 0;
      line-height: 1.5;
    }
    .report-reason-option {
      display: block;
      width: 100%;
      padding: 12px 13px;
      margin-bottom: 8px;
      border: 1px solid #e1e6eb;
      border-radius: 11px;
      background: #f9fafb;
      color: var(--text-color);
      text-align: left;
      font-size: 14px;
    }
    .report-reason-option.selected {
      border-color: var(--primary-color);
      background: #e7f3ff;
      font-weight: 700;
    }
    .report-modal-actions {
      display: flex;
      gap: 9px;
      margin-top: 14px;
    }
    .report-modal-actions button {
      flex: 1;
      min-height: 44px;
      border: none;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
    }
    #report-cancel-btn { background: #e4e6eb; color: var(--text-color); }
    #report-submit-btn { background: var(--primary-color); color: white; }
    #report-submit-btn:disabled { opacity: .6; }
  </style>
</head>
<body>

<!-- =====================================================
     PART 2 OF 7 — TOP BAR
===================================================== -->

  <div class="topbar">
    <span>GenWave</span>
    <div class="topbar-actions" id="topbar-actions">
      <a href="profile.html" class="user-avatar-small" id="user-initial">U</a>

<!-- =====================================================
     PART 3 OF 7 — WELCOME
===================================================== -->

  <div class="container">
    <h2 class="welcome-text" id="welcome-header">Welcome back 👋</h2>
    <p class="sub-text">Here's what's happening in your communities</p>

<!-- =====================================================
     PART 4 OF 7 — STATUS STRIP
===================================================== -->

    <div class="status-strip" id="status-strip">
      <a href="create-status.html" class="status-circle-btn add-status">

          <div class="status-avatar-inner">+</div>

<!-- =====================================================

    <div class="categories-scroll" id="categories">

    <div id="posts-feed">

<!-- =====================================================
     REPORT POST MODAL
===================================================== -->

  <div id="report-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Report this post">
    <div class="report-modal-card">
      <h3>🚩 Report this post</h3>
      <p>Let us know why you're reporting this post. Our team will review it.</p>

      <div id="report-reason-list">
        <button type="button" class="report-reason-option" data-reason="Spam">Spam or misleading</button>
        <button type="button" class="report-reason-option" data-reason="Abusive language">Abusive or hateful language</button>

      </div>

<!-- =====================================================
     PART 7 OF 7 — FIREBASE LOGIC WITH PAGINATION + UNREAD BADGE
===================================================== -->

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, limit, startAfter, getDocs, doc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBntgbWufmOsE-zW3sqpF8MXlXpCfvTUb4",
      authDomain: "genwave-f7e38.firebaseapp.com",
      projectId: "genwave-f7e38",
      storageBucket: "genwave-f7e38.firebasestorage.app",
      messagingSenderId: "464171809471",
      appId: "1:464171809471:web:9051791ab5b5f99616a40a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const POSTS_PER_PAGE = 50;
    let currentUser = null;
    let currentUserName = "Member";
    let currentUserIsAdmin = false;
    let selectedCategory = "For You";
    let allPosts = [];
    let lastVisibleDoc = null;
    let noMorePosts = false;
    let isLoadingMore = false;

    const feed = document.getElementById('posts-feed');
    const categories = document.getElementById('categories');
    const statusStrip = document.getElementById('status-strip');
    const loadMoreSentinel = document.getElementById('load-more-sentinel');
    const unreadBadge = document.getElementById('unread-badge');
    const topbarActions = document.getElementById('topbar-actions');

    // Report modal elements
    const reportModal = document.getElementById('report-modal');
    const reportReasonList = document.getElementById('report-reason-list');
    const reportCancelBtn = document.getElementById('report-cancel-btn');
    const reportSubmitBtn = document.getElementById('report-submit-btn');

    let reportTargetPostId = null;
    let reportTargetAuthorId = null;
    let reportTargetMessage = "";
    let selectedReportReason = null;

    categories.addEventListener('click', (e) => {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      selectedCategory = chip.dataset.category;
      categories.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      renderFeed();
    });

    /* =====================================================
       ADMIN REPORTS LINK

       Only ever inserted into the top bar when
       currentUserIsAdmin is true — for every
       other account this is simply never added
       to the page, not just hidden with CSS.
    ===================================================== */
    function updateAdminLink() {
      const existing = document.getElementById('admin-reports-link');
      if (!currentUserIsAdmin) {
        if (existing) existing.remove();
        return;
      }
      if (existing) return;

      const link = document.createElement('a');
      link.id = 'admin-reports-link';
      link.href = 'admin-reports.html';
      link.className = 'admin-link';
      link.title = 'Reported posts';
      link.setAttribute('aria-label', 'Review reported posts');
      link.textContent = '🛡️';

      topbarActions.insertBefore(link, topbarActions.firstChild);
    }

    function renderFeed() {
      const filtered = selectedCategory === "For You"
        ? allPosts
        : allPosts.filter(p => p.category === selectedCategory);

      if (filtered.length === 0) {
        feed.innerHTML = `<div class="empty-state"><div class="icon">🌊</div><p>No posts in ${selectedCategory} yet.</p></div>`;
        return;
      }

      feed.innerHTML = filtered.map(post => {
        const initial = (post.authorName || "G").charAt(0).toUpperCase();
        let mediaElement = "";
        if (post.mediaUrl) {
          mediaElement = post.mediaType === "video"
            ? `<div class="post-media" style="position:relative; cursor:pointer;" onclick="window.location.href='reels.html?start=${post.id}'"><video src="${post.mediaUrl}" muted style="width:100%; border-radius:12px; max-height:350px; object-fit:cover; display:block;"></video><div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:40px; color:white; text-shadow:0 2px 8px rgba(0,0,0,0.5);">▶</div></div>`
            : `<img src="${post.mediaUrl}" class="post-media" alt="Post photo">`;
        }
        const likes = Array.isArray(post.likes) ? post.likes : [];
        const isLiked = currentUser && likes.includes(currentUser.uid);
        const commentsCount = post.commentsCount || 0;
        const isOwner = currentUser && post.uid === currentUser.uid;
        const canReport = currentUser && post.uid && post.uid !== currentUser.uid;
        const canAdminDelete = currentUserIsAdmin && !isOwner;
        const safeContent = (post.content || "").replace(/'/g, "&#39;");

        return `
          <div class="post-card" data-id="${post.id}">
            <div class="post-header">
              <div class="post-author-avatar">${initial}</div>
              <div style="flex:1;">
                <div class="post-author-name">${post.authorName}</div>
                <div class="post-time">${post.category || "General"}</div>
              </div>
              ${isOwner ? `<button class="delete-post-btn" data-id="${post.id}" style="background:none; border:none; color:#b00020; font-size:18px;">🗑️</button>` : ''}
            </div>
            ${post.content ? `<div class="post-content">${post.content}</div>` : ""}
            ${mediaElement}
            <div class="post-actions">
              <button class="like-btn ${isLiked ? 'liked' : ''}" data-id="${post.id}">❤️ ${likes.length}</button>
              <a href="comments.html?postId=${post.id}" class="comment-btn" style="text-align:center; text-decoration:none; display:block;">💬 ${commentsCount > 0 ? commentsCount : 'Comment'}</a>
              <button class="share-btn" data-id="${post.id}">🔗 Share</button>
            </div>
            ${canReport ? `
            <div class="admin-actions">
              <button class="report-btn" data-id="${post.id}" data-author="${post.uid}" data-message="${safeContent}">🚩 Report this post</button>
            </div>` : ''}
            ${canAdminDelete ? `
            <div class="admin-actions">
              <button class="admin-delete-btn" data-id="${post.id}">🛡️ Remove Post (Admin)</button>
            </div>` : ''}
          </div>
        `;
      }).join('');

      updateSentinelText();
    }

    function updateSentinelText() {
      if (noMorePosts) {
        loadMoreSentinel.textContent = allPosts.length > 0 ? "You're all caught up 🌊" : "";
      } else {
        loadMoreSentinel.textContent = "";
      }
    }

    /* =====================================================
       REPORT MODAL LOGIC
    ===================================================== */
    function openReportModal(postId, authorId, message) {
      if (!currentUser) { window.location.href = "login.html"; return; }

      reportTargetPostId = postId;
      reportTargetAuthorId = authorId || "";
      reportTargetMessage = message || "";
      selectedReportReason = null;

      reportReasonList.querySelectorAll('.report-reason-option').forEach(b => b.classList.remove('selected'));
      reportSubmitBtn.disabled = true;
      reportSubmitBtn.textContent = "Submit report";

      reportModal.classList.add('open');
      reportModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeReportModal() {
      reportModal.classList.remove('open');
      reportModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      reportTargetPostId = null;
      reportTargetAuthorId = null;
      reportTargetMessage = "";
      selectedReportReason = null;
    }

    reportReasonList.addEventListener('click', (e) => {
      const option = e.target.closest('.report-reason-option');
      if (!option) return;
      reportReasonList.querySelectorAll('.report-reason-option').forEach(b => b.classList.remove('selected'));
      option.classList.add('selected');
      selectedReportReason = option.dataset.reason || "Other";
      reportSubmitBtn.disabled = false;
    });

    reportCancelBtn.addEventListener('click', closeReportModal);

    reportModal.addEventListener('click', (e) => {
      if (e.target === reportModal) closeReportModal();
    });

    reportSubmitBtn.addEventListener('click', async () => {
      if (!currentUser || !reportTargetPostId || !selectedReportReason) return;

      reportSubmitBtn.disabled = true;
      reportSubmitBtn.textContent = "Submitting...";

      try {
        await addDoc(collection(db, "reports"), {
          postId: reportTargetPostId,
          postAuthorId: reportTargetAuthorId,
          postMessageSnapshot: reportTargetMessage.slice(0, 300),
          reporterId: currentUser.uid,
          reporterName: currentUserName,
          reason: selectedReportReason,
          status: "pending",
          timestamp: serverTimestamp()
        });

        alert("Thank you — this post has been reported and will be reviewed.");
        closeReportModal();
      } catch (err) {
        console.error("Error submitting report:", err);
        alert("The report could not be submitted. Please try again.");
        reportSubmitBtn.disabled = false;
        reportSubmitBtn.textContent = "Submit report";
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && reportModal.classList.contains('open')) {
        closeReportModal();
      }
    });

    feed.addEventListener('click', async (e) => {
      const likeBtn = e.target.closest('.like-btn');
      const shareBtn = e.target.closest('.share-btn');
      const deleteBtn = e.target.closest('.delete-post-btn');
      const reportBtn = e.target.closest('.report-btn');
      const adminDeleteBtn = e.target.closest('.admin-delete-btn');

      if (reportBtn) {
        openReportModal(
          reportBtn.dataset.id,
          reportBtn.dataset.author,
          reportBtn.dataset.message
        );
        return;
      }

      if (deleteBtn || adminDeleteBtn) {
        const btn = deleteBtn || adminDeleteBtn;
        const isAdminAction = !!adminDeleteBtn;
        if (!confirm(isAdminAction ? "Remove this post as admin? This cannot be undone." : "Delete this post?")) return;
        const postId = btn.dataset.id;
        try {
          await deleteDoc(doc(db, "posts", postId));
          allPosts = allPosts.filter(p => p.id !== postId);
          renderFeed();
        } catch (err) {
          console.error("Error deleting post:", err);
          alert("Could not delete post.");
        }
        return;
      }

      if (likeBtn) {
        if (!currentUser) { window.location.href = "login.html"; return; }
        const postId = likeBtn.dataset.id;
        const post = allPosts.find(p => p.id === postId);
        if (!post) return;

        const likes = Array.isArray(post.likes) ? post.likes : [];
        const alreadyLiked = likes.includes(currentUser.uid);
        const updatedLikes = alreadyLiked
          ? likes.filter(uid => uid !== currentUser.uid)
          : [...likes, currentUser.uid];

        likeBtn.disabled = true;
        try {
          await updateDoc(doc(db, "posts", postId), { likes: updatedLikes });
          post.likes = updatedLikes;
          renderFeed();
        } catch (err) {
          console.error("Error updating like:", err);
        } finally {
          likeBtn.disabled = false;
        }
        return;
      }

      if (shareBtn) {
        const postId = shareBtn.dataset.id;
        const shareUrl = `${window.location.origin}${window.location.pathname}?post=${encodeURIComponent(postId)}`;
        try {
          if (navigator.share) {
            await navigator.share({ title: "GenWave", url: shareUrl });
          } else {
            await navigator.clipboard.writeText(shareUrl);
            alert("Link copied!");
          }
        } catch (err) {
          console.log("Share cancelled or failed:", err);
        }
      }
    });

    async function loadStatuses() {
      try {
        const snap = await getDocs(collection(db, "statuses"));
        const now = Date.now();
        const dayMs = 24 * 60 * 60 * 1000;

        const activeByUser = new Map();
        snap.docs.forEach(d => {
          const data = d.data();
          const time = data.timestamp?.toMillis?.() || 0;
          if (now - time < dayMs) {
            activeByUser.set(data.userId, data);
          }
        });

        if (activeByUser.size === 0) return;

        const userIds = [...activeByUser.keys()];
        const nameEntries = await Promise.all(userIds.map(async (uid) => {
          try {
            const uSnap = await getDoc(doc(db, "users", uid));
            return [uid, uSnap.exists() ? (uSnap.data().fullName || "Member") : "Member"];
          } catch {
            return [uid, "Member"];
          }
        }));
        const namesMap = new Map(nameEntries);

        const circlesHtml = userIds.map(uid => {
          const name = namesMap.get(uid) || "Member";
          return `
            <a href="view-status.html?uid=${encodeURIComponent(uid)}" class="status-circle-btn">
              <div class="status-avatar-outer">
                <div class="status-avatar-inner">${name.charAt(0).toUpperCase()}</div>
              </div>
              <div class="status-name">${name}</div>
            </a>
          `;
        }).join('');

        statusStrip.insertAdjacentHTML('beforeend', circlesHtml);
      } catch (err) {
        console.error("Error loading statuses:", err);
      }
    }

    async function loadFirstPage() {
      try {
        const firstQuery = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(POSTS_PER_PAGE));
        const snapshot = await getDocs(firstQuery);

        allPosts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        lastVisibleDoc = snapshot.docs.length > 0 ? snapshot.docs[snapshot.docs.length - 1] : null;
        noMorePosts = snapshot.docs.length < POSTS_PER_PAGE;

        renderFeed();
      } catch (err) {
        console.error("Error loading posts:", err);
        feed.innerHTML = `<div class="empty-state"><div class="icon">🌊</div><p>Your feed is just getting started.<br>Tap + to share your first post!</p></div>`;
      }
    }

    async function loadMorePosts() {
      if (isLoadingMore || noMorePosts || !lastVisibleDoc) return;
      isLoadingMore = true;
      loadMoreSentinel.textContent = "Loading more...";

      try {
        const nextQuery = query(
          collection(db, "posts"),
          orderBy("createdAt", "desc"),
          startAfter(lastVisibleDoc),
          limit(POSTS_PER_PAGE)
        );
        const snapshot = await getDocs(nextQuery);

        if (snapshot.empty) {
          noMorePosts = true;
        } else {
          const newPosts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          allPosts = allPosts.concat(newPosts);
          lastVisibleDoc = snapshot.docs[snapshot.docs.length - 1];
          noMorePosts = snapshot.docs.length < POSTS_PER_PAGE;
          renderFeed();
        }
      } catch (err) {
        console.error("Error loading more posts:", err);
      } finally {
        isLoadingMore = false;
        updateSentinelText();
      }
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) loadMorePosts();
      });
    }, { rootMargin: "300px" });

    observer.observe(loadMoreSentinel);

    async function checkUnreadMessages() {
      if (!currentUser) return;
      try {
        const convosQuery = query(
          collection(db, "conversations"),
          where("participants", "array-contains", currentUser.uid)
        );
        const snap = await getDocs(convosQuery);

        let unreadCount = 0;

        for (const convoDoc of snap.docs) {
          const convo = convoDoc.data();
          if (!convo.lastMessageAt || convo.lastSenderId === currentUser.uid) continue;

          try {
            const readSnap = await getDoc(doc(db, "conversations", convoDoc.id, "readStatus", currentUser.uid));
            const lastReadAt = readSnap.exists() ? readSnap.data().lastReadAt : null;

            const lastMsgTime = convo.lastMessageAt?.toMillis?.() || 0;
            const lastReadTime = lastReadAt?.toMillis?.() || 0;

            if (lastMsgTime > lastReadTime) {
              unreadCount++;
            }
          } catch (err) {
            console.log("Could not check read status:", err);
          }
        }

        if (unreadCount > 0) {
          unreadBadge.textContent = unreadCount > 9 ? "9+" : unreadCount;
          unreadBadge.classList.add('show');
        } else {
          unreadBadge.classList.remove('show');
        }
      } catch (err) {
        console.error("Error checking unread messages:", err);
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUser = user;

      try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        const name = userDoc.exists() ? (userDoc.data().fullName || "Member") : (user.displayName || "Member");
        currentUserName = name;
        currentUserIsAdmin = userDoc.exists() && userDoc.data().isAdmin === true;
        document.getElementById('welcome-header').textContent = `Welcome back, ${name} 👋`;
        document.getElementById('user-initial').textContent = name.charAt(0).toUpperCase();
        updateAdminLink();
      } catch (err) {
        console.error("Error loading profile:", err);
      }

      loadStatuses();
      loadFirstPage();
      checkUnreadMessages();
    });
  </script>

</body>
