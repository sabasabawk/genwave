<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - GenWave</title>
  <style>
    :root {
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #222222;
      --muted-text: #666666;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 70px;
    }
    .topbar {
      background: linear-gradient(135deg, #007bff, #00d2ff);
      color: white;
      padding: 16px 20px;
      font-size: 20px;
      font-weight: 800;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(5px);
    }
    .convo-list { padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
    .convo-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      text-decoration: none;
      color: var(--text-color);
    }
    .convo-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007bff, #00d2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }
    .convo-info { flex: 1; min-width: 0; }
    .convo-name { font-size: 14px; font-weight: 700; }
    .convo-preview {
      font-size: 12px;
      color: var(--muted-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .convo-time { font-size: 11px; color: var(--muted-text); flex-shrink: 0; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted-text); }
    .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
    .btn-primary {
      display: inline-block;
      margin-top: 16px;
      background: var(--primary-color);
      color: white;
      padding: 12px 24px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.06);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      color: var(--muted-text);
      text-decoration: none;
    }
    .nav-item.active { color: var(--primary-color); font-weight: 700; }
    .nav-item .nav-icon { font-size: 20px; }
  </style>
</head>
<body>

  <div class="topbar">
    <span>Messages</span>
    <a href="members.html" class="topbar-btn">🔍 Find Members</a>
  </div>

  <div class="convo-list" id="convo-list">
    <div class="empty-state">
      <div class="icon">💬</div>
      <p>Loading conversations...</p>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item">
      <div class="nav-icon">🏠</div>
      Home
    </a>
    <a href="groups.html" class="nav-item">
      <div class="nav-icon">👥</div>
      Groups
    </a>
    <a href="conversations.html" class="nav-item active">
      <div class="nav-icon">💬</div>
      Messages
    </a>
    <a href="profile.html" class="nav-item">
      <div class="nav-icon">👤</div>
      Profile
    </a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBntgbWufmOsE-zW3sqpF8MXlXpCfvTUb4",
      authDomain: "genwave-f7e38.firebaseapp.com",
      projectId: "genwave-f7e38",
      storageBucket: "genwave-f7e38.firebasestorage.app",
      messagingSenderId: "464171809471",
      appId: "1:464171809471:web:9051791ab5b5f99616a40a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const convoList = document.getElementById('convo-list');

    function formatTime(timestamp) {
      if (!timestamp) return "";
      const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      if (diffMins < 1) return "now";
      if (diffMins < 60) return `${diffMins}m`;
      const diffHours = Math.floor(diffMins / 60);
      if (diffHours < 24) return `${diffHours}h`;
      const diffDays = Math.floor(diffHours / 24);
      return `${diffDays}d`;
    }

    async function loadConversations(user) {
      try {
        const convosQuery = query(
          collection(db, "conversations"),
          where("participants", "array-contains", user.uid)
        );

        const snapshot = await getDocs(convosQuery);

        if (snapshot.empty) {
          convoList.innerHTML = `
            <div class="empty-state">
              <div class="icon">💬</div>
              <p>No conversations yet.<br>Start a conversation with other members!</p>
              <a href="members.html" class="btn-primary">Find Members</a>
            </div>
          `;
          return;
        }

        const sortedDocs = [...snapshot.docs].sort((a, b) => {
          const aTime = a.data().lastMessageAt?.toMillis?.() || 0;
          const bTime = b.data().lastMessageAt?.toMillis?.() || 0;
          return bTime - aTime;
        });

        const cards = await Promise.all(sortedDocs.map(async (docSnap) => {
          const convo = docSnap.data();
          const otherUid = convo.participants ? convo.participants.find(uid => uid !== user.uid) : null;
          let otherName = "GenWave User";

          if (otherUid) {
            try {
              const otherUserSnap = await getDoc(doc(db, "users", otherUid));
              if (otherUserSnap.exists()) {
                otherName = otherUserSnap.data().fullName || otherName;
              }
            } catch (err) {
              console.log("Could not load user:", err);
            }
          }

          const initial = otherName.charAt(0).toUpperCase();
          const preview = convo.lastMessage || "Say hello 👋";
          const time = formatTime(convo.lastMessageAt);

          return `
            <a href="chat.html?uid=${encodeURIComponent(otherUid)}" class="convo-card">
              <div class="convo-avatar">${initial}</div>
              <div class="convo-info">
                <div class="convo-name">${otherName}</div>
                <div class="convo-preview">${preview}</div>
              </div>
              <div class="convo-time">${time}</div>
            </a>
          `;
        }));

        convoList.innerHTML = cards.join('');
      } catch (err) {
        console.error("Error loading conversations:", err);
        convoList.innerHTML = `
          <div class="empty-state">
            <div class="icon">💬</div>
            <p>No conversations yet.</p>
            <a href="members.html" class="btn-primary">Find Members</a>
          </div>
        `;
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      loadConversations(user);
    });
  </script>

</body>
</html>
